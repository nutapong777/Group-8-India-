<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สไลด์นำเสนอ · Group 8 India Crime</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  :root { --ink:#141a2e; --ink2:#4a5068; --ink3:#7c8298; --line:#e6e9f2; --soft:#f6f7fb; --accent:#4c6ef5; --accent-ink:#3b5bdb; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:15px/1.6 "IBM Plex Sans Thai", system-ui, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  nav.crumb { font-size: 13.5px; margin-bottom: 14px; }
  nav.crumb a { color: var(--accent-ink); text-decoration: none; }
  .head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .eyebrow { font: 500 12px/1 "IBM Plex Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); margin:0 0 8px; }
  h1 { font: 600 clamp(22px,3vw,30px)/1.25 "Bai Jamjuree", sans-serif; margin:0; text-wrap: balance; }
  .btn { display:inline-flex; align-items:center; gap:6px; font:500 14px/1 "IBM Plex Sans Thai",sans-serif; color:var(--ink); background:#fff;
         border:1px solid var(--line); border-radius:8px; padding:9px 14px; text-decoration:none; cursor:pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
  .stage { position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--soft);
           box-shadow: 0 1px 2px rgba(20,26,46,.04), 0 6px 20px rgba(20,26,46,.06); }
  .stage img { display:block; width:100%; height:auto; aspect-ratio: 16 / 9; object-fit: contain; background:#fff; }
  .stage:fullscreen { display:flex; align-items:center; justify-content:center; background:#000; border-radius:0; }
  .stage:fullscreen img { max-height:100vh; width:auto; max-width:100vw; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
           background:rgba(255,255,255,.92); font-size:22px; line-height:1; cursor:pointer; color:var(--ink); }
  .arrow:hover { border-color: var(--accent); }
  .arrow.prev { left:12px; } .arrow.next { right:12px; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 18px; }
  .count { font: 500 14px "IBM Plex Mono", monospace; color: var(--ink2); }
  .stitle { color: var(--ink2); }
  .thumbs { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .thumbs button { padding:0; border:2px solid transparent; border-radius:8px; overflow:hidden; background:#fff; cursor:pointer; text-align:left; }
  .thumbs button img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
  .thumbs button span { display:block; font-size:12px; color:var(--ink2); padding:4px 6px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thumbs button[aria-current="true"] { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 600px) { .arrow { width:36px; height:36px; font-size:18px; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="crumb"><a href="../index.html">← หน้าแรก</a></nav>
  <div class="head">
    <div>
      <p class="eyebrow">สไลด์นำเสนอ · 15 หน้า</p>
      <h1>การวิเคราะห์ประสิทธิภาพกระบวนการยุติธรรมระดับเขตในประเทศอินเดีย ด้วย K-Means และต้นไม้ตัดสินใจ</h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="fs" type="button">เต็มจอ</button>
      <a class="btn primary" href="slides.pdf" target="_blank" rel="noopener">เปิด PDF</a>
    </div>
  </div>

  <div class="stage" id="stage">
    <img id="main" src="slides/slide-01.jpg" alt="">
    <button class="arrow prev" id="prev" type="button" aria-label="สไลด์ก่อนหน้า">‹</button>
    <button class="arrow next" id="next" type="button" aria-label="สไลด์ถัดไป">›</button>
  </div>
  <div class="bar">
    <span class="count" id="count">1 / 15</span>
    <span class="stitle" id="stitle"></span>
    <span style="color:var(--ink3);font-size:13px">ใช้ปุ่มลูกศร ← → บนคีย์บอร์ดได้</span>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>
<script>
  const TITLES = ["ชื่อเรื่อง", "สมาชิก", "ภาพรวมชุดข้อมูล", "Business Understanding", "Data Understanding",
    "Data Preparation", "Model Selection & Validation (Elbow)", "Model Selection & Validation (Accuracy)", "Evaluation",
    "Deployment / Visualization", "เปรียบเทียบข้อดีข้อเสีย", "ตารางเปรียบเทียบรายประเด็น", "Data Dictionary",
    "ปัญหาที่พบและวิธีแก้", "Thank you · Q&A"];
  const N = TITLES.length, src = i => `slides/slide-${String(i + 1).padStart(2, "0")}.jpg`;
  const main = document.getElementById("main"), thumbs = document.getElementById("thumbs");
  let cur = 0;
  thumbs.innerHTML = TITLES.map((t, i) => `<button type="button" data-i="${i}"><img src="${src(i)}" alt="" loading="lazy"><span>${i + 1}. ${t}</span></button>`).join("");
  function show(i) {
    cur = (i + N) % N;
    main.src = src(cur);
    main.alt = `สไลด์ ${cur + 1}: ${TITLES[cur]}`;
    document.getElementById("count").textContent = `${cur + 1} / ${N}`;
    document.getElementById("stitle").textContent = TITLES[cur];
    thumbs.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-current", k === cur));
    const n = new Image(); n.src = src((cur + 1) % N); // preload next
  }
  thumbs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { show(+b.dataset.i); window.scrollTo({ top: 0, behavior: "smooth" }); } });
  document.getElementById("prev").onclick = () => show(cur - 1);
  document.getElementById("next").onclick = () => show(cur + 1);
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(cur + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  });
  let x0 = null; // swipe on phones
  main.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  main.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); x0 = null; });
  document.getElementById("fs").onclick = () => { const s = document.getElementById("stage"); (document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.())?.catch?.(() => {}); };
  const h = parseInt(location.hash.slice(1)); show(Number.isFinite(h) ? h - 1 : 0);
</script>
</body>
</html>
