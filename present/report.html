<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงาน CRISP-DM · Group 8 India Crime</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  :root { --ink:#141a2e; --ink2:#4a5068; --ink3:#7c8298; --line:#e6e9f2; --soft:#f6f7fb; --accent:#4c6ef5; --accent-ink:#3b5bdb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--soft); color:var(--ink); font:15px/1.6 "IBM Plex Sans Thai", system-ui, sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .hwrap { max-width: 900px; margin:0 auto; padding:14px 16px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
  .hwrap a.back { color: var(--accent-ink); text-decoration:none; font-size:13.5px; }
  h1 { font: 600 20px/1.3 "Bai Jamjuree", sans-serif; margin:0; }
  .eyebrow { font: 500 11.5px/1 "IBM Plex Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); margin:0 0 4px; }
  .btn { display:inline-flex; font:500 14px/1 "IBM Plex Sans Thai",sans-serif; color:#fff; background:var(--accent); border-radius:8px; padding:9px 14px; text-decoration:none; }
  main { max-width: 900px; margin:0 auto; padding:20px 16px 48px; display:grid; gap:18px; }
  figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow: 0 1px 2px rgba(20,26,46,.05), 0 8px 24px rgba(20,26,46,.06); overflow:hidden; }
  figure img { display:block; width:100%; height:auto; aspect-ratio: 612 / 792; }
  figcaption { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink3); text-align:center; padding:6px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <a class="back" href="../index.html">← หน้าแรก</a>
      <p class="eyebrow" style="margin-top:6px">รายงาน · 12 หน้า</p>
      <h1>รายงานกระบวนการทำงาน CRISP-DM</h1>
    </div>
    <a class="btn" href="report.pdf" target="_blank" rel="noopener">เปิด PDF</a>
  </div>
</header>
<main id="pages"></main>
<script>
  const N = 12;
  document.getElementById("pages").innerHTML = Array.from({ length: N }, (_, i) => {
    const n = String(i + 1).padStart(2, "0");
    return `<figure id="p${i + 1}"><img src="report/page-${n}.jpg" alt="รายงานหน้า ${i + 1}" loading="${i < 2 ? "eager" : "lazy"}"><figcaption>หน้า ${i + 1} / ${N}</figcaption></figure>`;
  }).join("");
</script>
</body>
</html>
